<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Tutorial 04 - 最簡網頁錄音辨識</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
    <h2>🎙️ Tutorial 04：瀏覽器直接錄音原型</h2>
    <button id="btnStart">🔴 開始錄音</button>
    <button id="btnStop" disabled>⏹️ 停止並送出</button>
    <p id="status">狀態：待機中</p>
    <h3>辨識結果：</h3>
    <p id="result" style="font-size: 1.2em; color: #0056b3; background: #f4f4f4; padding: 15px;"></p>

    <script>
        let recorder, chunks = [];
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');

        btnStart.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            recorder = new MediaRecorder(stream);
            chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('file', blob, 'record.webm');

                document.getElementById('status').innerText = '狀態：辨識中...';
                const res = await fetch('/api/transcribe', { method: 'POST', body: formData });
                const data = await res.json();
                
                document.getElementById('status').innerText = '狀態：完成';
                document.getElementById('result').innerText = data.text || '(無語音內容)';
                stream.getTracks().forEach(t => t.stop());
            };

            recorder.start();
            btnStart.disabled = true;
            btnStop.disabled = false;
            document.getElementById('status').innerText = '狀態：🔴 錄音中...';
        };

        btnStop.onclick = () => {
            recorder.stop();
            btnStart.disabled = false;
            btnStop.disabled = true;
        };
    </script>
</body>
</html>
